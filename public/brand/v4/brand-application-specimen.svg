<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="specimen-title specimen-description"><title id="specimen-title">Itachi signature application study</title><desc id="specimen-description">Technical dark and light signature applications with obsidian, charcoal, crimson and ivory swatches. Independent hand-traced concept, creator approval pending.</desc><rect width="1440" height="900" fill="#0b0b0d"/><rect x="750" y="60" width="620" height="300" fill="#f1eadf"/><text x="70" y="65" fill="#f1eadf" font-family="sans-serif" font-size="18" letter-spacing="3">ITACHI / SIGNATURE STUDY 01</text><svg x="70" y="85" width="660" height="253" viewBox="0 0 334 128"><title id="itachi-title">Itachi — hand-traced signature study</title><desc id="itachi-description">A smooth crimson cursive Itachi lettering study traced from a small mask reference, with connected loops and a gently rising baseline. Independent concept; creator approval pending. This is a simplified study, not a certified original logo.</desc><g transform="translate(7 4)" fill="none" stroke="#bd2942" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round"><path d="M 100 28 C 79 20 42 23 29 40 C 16 57 40 66 59 49 C 79 32 88 17 98 24 C 110 32 88 60 66 82 C 47 102 24 112 14 102 C 4 91 21 79 33 84 C 44 89 35 102 23 103"/><path d="M 67 81 C 79 92 93 87 104 68 L 135 22 C 119 46 102 73 104 83 C 106 94 122 85 137 70"/><path d="M 111 52 C 126 49 139 48 151 48"/><path d="M 174 55 C 165 42 149 53 140 68 C 126 91 148 96 164 76 L 179 51 C 170 67 162 83 169 86 C 176 91 191 77 200 66"/><path d="M 229 51 C 229 39 211 47 199 64 C 184 87 201 93 222 73 C 232 64 241 56 248 44"/><path d="M 225 77 C 243 52 259 21 272 17 C 287 15 268 46 244 58 C 232 80 232 86 241 81 C 250 76 264 54 272 56 C 280 57 260 80 268 81 C 277 83 288 69 296 58"/><path d="M 302 49 C 293 61 282 79 288 81 C 294 84 307 70 316 60"/><path d="M 307 35 C 308 33 309 32 310 31"/></g></svg><image href="data:image/svg+xml;base64," x="790" y="90" width="540" height="207"/><text x="70" y="390" fill="#f1eadf" font-family="sans-serif" font-size="27">A small signature. Room for the person.</text><text x="70" y="433" fill="#bdb6ad" font-family="sans-serif" font-size="19">Hand-traced study · connected script · creator approval pending</text><line x1="70" y1="474" x2="1370" y2="474" stroke="#373338"/><text x="70" y="527" fill="#f1eadf" font-family="sans-serif" font-size="17">Obsidian</text><rect x="70" y="550" width="290" height="110" fill="#0b0b0d" stroke="#575157"/><text x="70" y="698" fill="#bdb6ad" font-family="monospace" font-size="18">#0B0B0D</text><text x="405" y="527" fill="#f1eadf" font-family="sans-serif" font-size="17">Charcoal</text><rect x="405" y="550" width="290" height="110" fill="#171719"/><text x="405" y="698" fill="#bdb6ad" font-family="monospace" font-size="18">#171719</text><text x="740" y="527" fill="#f1eadf" font-family="sans-serif" font-size="17">Crimson</text><rect x="740" y="550" width="290" height="110" fill="#BD2942"/><text x="740" y="698" fill="#bdb6ad" font-family="monospace" font-size="18">#BD2942</text><text x="1075" y="527" fill="#f1eadf" font-family="sans-serif" font-size="17">Ivory</text><rect x="1075" y="550" width="295" height="110" fill="#f1eadf"/><text x="1075" y="698" fill="#bdb6ad" font-family="monospace" font-size="18">#F1EADF</text><text x="70" y="778" fill="#f1eadf" font-family="sans-serif" font-size="21">Sans for navigation · restrained serif for headlines · Amiri for reviewed Arabic</text><text x="70" y="825" fill="#bdb6ad" font-family="sans-serif" font-size="18">A reproduction study; no font identity, rights ownership, or endorsement asserted.</text></svg>
